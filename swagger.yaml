openapi: 3.0.3
info:
  title: Blue Nest Montessori API
  description: |
    REST API for the Blue Nest Montessori nursery store and blog platform.
    
    ## Authentication
    Most endpoints require JWT authentication. Include the access token in the Authorization header:
    `Authorization: Bearer <access_token>`
    
    ## Roles
    - **customer**: Regular authenticated users
    - **admin**: Administrative users with full access
    - **branch_manager**: Branch-specific management access
  version: 1.0.0
  contact:
    name: Blue Nest Montessori
    url: https://blue-nest-montessori.com

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.blue-nest-montessori.com/api/v1
    description: Production server

tags:
  - name: Health
    description: Service health check endpoints
  - name: Auth
    description: Authentication and user management
  - name: Products
    description: Product catalog and categories
  - name: Blog
    description: Blog posts and articles
  - name: Branches
    description: Nursery branch locations
  - name: Cart
    description: Shopping cart management
  - name: Checkout
    description: Order checkout and payment
  - name: Orders
    description: Order management
  - name: Order Requests
    description: Staff supply requests (foundation for inventory)
  - name: Order Creation
    description: Catalogue, sourcing, and generated supplier carts (order creation tool)
  - name: Procurement
    description: Supplier directory + procurement analytics (Phase 3)
  - name: Admin
    description: Administrative operations (admin only)
  - name: Webhooks
    description: External webhook handlers
  - name: Organisations
    description: Multi-tenant organisation (nursery group) management
  - name: Children
    description: Enrolled / waitlisted children (occupancy source of truth)
  - name: Rooms
    description: Classrooms within a branch (capacity + staff ratio)
  - name: Staff
    description: HR staff records (practitioners / managers)
  - name: Staff Attendance
    description: Staff clock in/out register, summaries and corrections (payroll source)
  - name: Child Attendance
    description: Children's daily attendance register (check in/out, mark, KPI stats)
  - name: Rota
    description: Shift scheduling (staff → room / date / time)
  - name: Kiosk
    description: Entrance-tablet kiosk (device-token auth) + admin device management
  - name: Daily Records
    description: Practitioner daily logs — observations, incidents, safeguarding, medication, meals
  - name: Enquiries
    description: Admissions CRM (enquiry pipeline, tasks, registration)
  - name: Leave
    description: Staff leave / holiday requests (apply, balances, four-eyes approval)
  - name: My Profile
    description: Signed-in user's self-service hub (own profile, attendance, rota, notification preferences)
  - name: Notifications
    description: In-app notifications (own list, mark read) with opt-in email delivery
  - name: Room Assignments
    description: Effective-dated staff/child room allocation (the canonical room source of truth)
  - name: Configuration
    description: Org-scoped configuration — taxonomy lists, term dates, fee schedules, branch + email templates
  - name: Exports
    description: Server-side list exports (CSV default, ?format=xlsx for Excel)

paths:
  # ─────────────────────────────────────────────────────────────────────────────
  # Health
  # ─────────────────────────────────────────────────────────────────────────────
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API service
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ─────────────────────────────────────────────────────────────────────────────
  # Auth
  # ─────────────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register new user
      description: Create a new user account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - first_name
                - last_name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: securePassword123
                first_name:
                  type: string
                  example: John
                last_name:
                  type: string
                  example: Doe
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request body
        '409':
          description: Email already exists

  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Authenticate user and return JWT tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags:
        - Auth
      summary: User logout
      description: Invalidate the current session
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Use refresh token to obtain new access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        '401':
          description: Invalid or expired refresh token

  /auth/me:
    get:
      tags: [Auth]
      summary: Current identity + capabilities
      description: >-
        Returns the caller's id, email, role and resolved granular permission set (drives admin UI
        navigation/page gating), plus the caller's `org` (id, slug, name, branding, features) for
        multi-tenant branding + feature-flag gating.
      operationId: getMe
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  email: { type: string, format: email }
                  role: { type: string, enum: [super_admin, admin, branch_manager, director, finance, admissions, procurement, staff, customer] }
                  permissions:
                    type: array
                    items:
                      type: string
                      enum: [dashboard.view, store.manage, blog.manage, enquiries.manage, procurement.view, procurement.manage, suppliers.manage, finance.view, audit.view, branches.manage, children.manage, staff.manage, daily_logs.manage, users.manage]
                  org:
                    type: object
                    description: The caller's organisation (tenant) — branding + enabled feature flags.
                    properties:
                      id: { type: string }
                      slug: { type: string }
                      name: { type: string }
                      branding: { $ref: '#/components/schemas/OrgBranding' }
                      features:
                        type: array
                        items: { type: string }
        '401': { description: Unauthorized }

  /me/dashboard:
    get:
      tags: [Auth]
      summary: Get the caller's saved dashboard layout
      description: Returns the per-user customizable dashboard layout (widget order + hidden + size). Empty widget list when the user hasn't customised one.
      operationId: getDashboardLayout
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardLayout' } } } }
    put:
      tags: [Auth]
      summary: Save the caller's dashboard layout
      operationId: saveDashboardLayout
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                widgets:
                  type: array
                  items: { $ref: '#/components/schemas/DashboardWidget' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardLayout' } } } }

  # ─────────────────────────────────────────────────────────────────────────────
  # Products
  # ─────────────────────────────────────────────────────────────────────────────
  /products:
    get:
      tags:
        - Products
      summary: List all products
      description: Returns a paginated list of active products
      operationId: listProducts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer
                  page:
                    type: integer

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: Returns a single product by its ID
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

  /categories:
    get:
      tags:
        - Products
      summary: List all categories
      description: Returns all product categories
      operationId: listCategories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  # ─────────────────────────────────────────────────────────────────────────────
  # Blog
  # ─────────────────────────────────────────────────────────────────────────────
  /blog/posts:
    get:
      tags:
        - Blog
      summary: List blog posts
      description: Returns a list of published blog posts
      operationId: listBlogPosts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: tag
          in: query
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of blog posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlogPost'
                  total:
                    type: integer
                  page:
                    type: integer

  /blog/posts/{slug}:
    get:
      tags:
        - Blog
      summary: Get blog post by slug
      description: Returns a single blog post by its URL slug
      operationId: getBlogPost
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: my-first-post
      responses:
        '200':
          description: Blog post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogPost'
        '404':
          description: Blog post not found

  # ─────────────────────────────────────────────────────────────────────────────
  # Branches
  # ─────────────────────────────────────────────────────────────────────────────
  /branches:
    get:
      tags:
        - Branches
      summary: List all branches
      description: Returns all active nursery branches
      operationId: listBranches
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'

  /branches/{slug}:
    get:
      tags:
        - Branches
      summary: Get branch by slug
      description: Returns a single branch by its URL slug
      operationId: getBranch
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: borehamwood
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          description: Branch not found

  # ─────────────────────────────────────────────────────────────────────────────
  # Cart (Authenticated)
  # ─────────────────────────────────────────────────────────────────────────────
  /cart:
    get:
      tags:
        - Cart
      summary: Get user cart
      description: Returns the current user's shopping cart
      operationId: getCart
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /cart/items:
    post:
      tags:
        - Cart
      summary: Add item to cart
      description: Add a product to the shopping cart
      operationId: addCartItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - qty
              properties:
                product_id:
                  type: string
                  example: 507f1f77bcf86cd799439011
                qty:
                  type: integer
                  minimum: 1
                  example: 2
      responses:
        '201':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid request
        '404':
          description: Product not found

  /cart/items/{id}:
    put:
      tags:
        - Cart
      summary: Update cart item quantity
      description: Update the quantity of an item in the cart
      operationId: updateCartItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qty
              properties:
                qty:
                  type: integer
                  minimum: 0
                  example: 3
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Cart item not found

    delete:
      tags:
        - Cart
      summary: Remove cart item
      description: Remove an item from the shopping cart
      operationId: removeCartItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Item removed from cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Cart item not found

  # ─────────────────────────────────────────────────────────────────────────────
  # Checkout (Authenticated)
  # ─────────────────────────────────────────────────────────────────────────────
  /checkout/session:
    post:
      tags:
        - Checkout
      summary: Create checkout session
      description: Create a Stripe checkout session for the current cart
      operationId: createCheckoutSession
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - success_url
                - cancel_url
                - customer_name
                - customer_email
                - customer_phone
              properties:
                success_url:
                  type: string
                  format: uri
                  example: https://bluenest.uk/checkout/success
                cancel_url:
                  type: string
                  format: uri
                  example: https://bluenest.uk/checkout/cancel
                customer_name: { type: string, description: "Customer full name (required)" }
                customer_email: { type: string, format: email, description: "Required" }
                customer_phone: { type: string, description: "Telephone (required)" }
                branch_slug: { type: string, description: "Optional nursery slug; empty or 'n/a' = Not applicable" }
                child_ref: { type: string, description: "Optional child name / reference (only when a branch is selected)" }
              description: >-
                Contact details are collected in-app; the delivery + billing address
                are collected and validated by Stripe's hosted checkout and reconciled
                onto the order by the webhook.
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  url:
                    type: string
                    format: uri
        '400':
          description: Cart is empty or invalid

  # ─────────────────────────────────────────────────────────────────────────────
  # Orders (Authenticated)
  # ─────────────────────────────────────────────────────────────────────────────
  /orders/me:
    get:
      tags:
        - Orders
      summary: List user's orders
      description: Returns all orders for the authenticated user
      operationId: listMyOrders
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of user's orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  total:
                    type: integer

  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      description: Returns a single order by its ID
      operationId: getOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          description: Not authorized to view this order
        '404':
          description: Order not found

  # ─────────────────────────────────────────────────────────────────────────────
  # Admin - Orders
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/orders:
    get:
      tags:
        - Admin
      summary: List all orders (admin)
      description: Returns all orders across all users
      operationId: adminListOrders
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, processing, shipped, delivered, cancelled]
      responses:
        '200':
          description: List of all orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  total:
                    type: integer

  /admin/orders/{id}:
    get:
      tags:
        - Admin
      summary: Get order by ID (admin)
      description: Returns a single order by its ID
      operationId: adminGetOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

  /admin/orders/{id}/status:
    patch:
      tags:
        - Admin
      summary: Update order status
      description: Update the status of an order
      operationId: updateOrderStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, paid, processing, shipped, delivered, cancelled]
                  example: processing
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status
        '404':
          description: Order not found

  # ─────────────────────────────────────────────────────────────────────────────
  # Admin - Products
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/products:
    get:
      tags:
        - Admin
      summary: List all products (admin)
      description: Returns all products including inactive ones
      operationId: adminListProducts
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of all products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer

    post:
      tags:
        - Admin
      summary: Create product
      description: Create a new product
      operationId: createProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /admin/products/{id}:
    put:
      tags:
        - Admin
      summary: Update product
      description: Update an existing product
      operationId: updateProduct
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

    delete:
      tags:
        - Admin
      summary: Delete product
      description: Delete a product
      operationId: deleteProduct
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      responses:
        '204':
          description: Product deleted

  # ─────────────────────────────────────────────────────────────────────────────
  # Admin - Blog
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/blog/posts:
    get:
      tags:
        - Admin
      summary: List all blog posts (admin)
      description: Returns all blog posts including drafts
      operationId: adminListBlogPosts
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of all blog posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlogPost'
                  total:
                    type: integer

    post:
      tags:
        - Admin
      summary: Create blog post
      description: Create a new blog post
      operationId: createBlogPost
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogPostInput'
      responses:
        '201':
          description: Blog post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogPost'

  /admin/blog/posts/{id}:
    put:
      tags:
        - Admin
      summary: Update blog post
      description: Update an existing blog post
      operationId: updateBlogPost
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogPostInput'
      responses:
        '200':
          description: Blog post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogPost'
        '404':
          description: Blog post not found

  # ─────────────────────────────────────────────────────────────────────────────
  # Admin - Users (super-admin account management)
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: List all users (super-admin)
      operationId: adminListUsers
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: List of users }
        '403': { description: Super-admin only }
    post:
      tags: [Admin]
      summary: Create a user (super-admin)
      operationId: adminCreateUser
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name, role]
              properties:
                email: { type: string }
                password: { type: string, minLength: 8 }
                first_name: { type: string }
                last_name: { type: string }
                role:
                  type: string
                  enum: [super_admin, admin, branch_manager, finance, admissions, procurement, staff, customer]
      responses:
        '201': { description: User created }
        '400': { description: Invalid input }

  /admin/users/{id}:
    put:
      tags: [Admin]
      summary: Update a user (super-admin). Optional password field also resets the password.
      operationId: adminUpdateUser
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                role:
                  type: string
                  enum: [super_admin, admin, branch_manager, finance, admissions, procurement, staff, customer]
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: User updated }
        '400': { description: Invalid input or self-demotion blocked }
    delete:
      tags: [Admin]
      summary: Delete a user (super-admin). Cannot delete your own account.
      operationId: adminDeleteUser
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: User deleted }
        '400': { description: Self-delete blocked }

  /admin/users/{id}/reset-password:
    post:
      tags: [Admin]
      summary: Reset a user's password (super-admin)
      operationId: adminResetPassword
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password updated }
        '400': { description: Invalid password }

  # ─────────────────────────────────────────────────────────────────────────────
  # Admin - Activity (audit log)
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: List admin activity (audit log)
      description: Append-only record of admin mutations. Visible to all management roles.
      operationId: adminListAuditLogs
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: actor, in: query, required: false, schema: { type: string } }
        - { name: entity_type, in: query, required: false, schema: { type: string } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 200 } }
      responses:
        '200': { description: List of audit log entries }

  # ─────────────────────────────────────────────────────────────────────────────
  # Order requests (staff supply requests)
  # ─────────────────────────────────────────────────────────────────────────────
  /order-requests:
    post:
      tags: [Order Requests]
      summary: Submit a supply request (staff + management)
      operationId: createOrderRequest
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                branch_slug: { type: string }
                notes: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [item_name, qty]
                    properties:
                      item_name: { type: string }
                      supplier: { type: string, enum: [Gompels, Amazon, Other] }
                      qty: { type: integer, minimum: 1 }
                      notes: { type: string }
                      code: { type: string, description: supplier product code (e.g. Gompels SKU) when picked from the catalogue }
                      catalogue_item_id: { type: string, description: links the line to a catalogue item/variant }
      responses:
        '201': { description: Request submitted }
        '400': { description: No items / invalid input }
        '403': { description: Customers cannot submit requests }

  /order-requests/me:
    get:
      tags: [Order Requests]
      summary: List my supply requests
      operationId: listMyOrderRequests
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: List of the caller's requests }

  /order-requests/{id}:
    get:
      tags: [Order Requests]
      summary: Get one of my supply requests (own-only)
      operationId: getOrderRequest
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The request }
        '403': { description: Not your request }
        '404': { description: Not found }

  /admin/order-requests:
    get:
      tags: [Admin]
      summary: List all supply requests (management)
      operationId: adminListOrderRequests
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: List of all requests }

  /admin/order-requests/{id}:
    get:
      tags: [Admin]
      summary: Get any supply request (management)
      operationId: adminGetOrderRequest
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The request }
        '404': { description: Not found }

  /admin/order-requests/{id}/status:
    patch:
      tags: [Admin]
      summary: Update supply request status (management). Audit-logged.
      operationId: adminUpdateOrderRequestStatus
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, ordered, received, cancelled]
      responses:
        '200': { description: Status updated }
        '400': { description: Invalid status }

  /order-requests/{id}/cancel:
    patch:
      tags: [Order Requests]
      summary: Cancel your own pending supply request
      operationId: cancelOrderRequest
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Request cancelled }
        '400': { description: Not pending / not your request }

  /catalogue:
    get:
      tags: [Order Creation]
      summary: List active catalogue items (staff read-only picker)
      operationId: listCatalogue
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Active catalogue items }

  /admin/catalogue:
    get:
      tags: [Admin]
      summary: List catalogue items
      operationId: adminListCatalogue
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: Catalogue items } }
    post:
      tags: [Admin]
      summary: Create a catalogue item
      operationId: adminCreateCatalogueItem
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                category: { type: string }
                is_active: { type: boolean }
                offers:
                  type: array
                  items:
                    type: object
                    properties:
                      supplier: { type: string, enum: [Gompels, Amazon, Other] }
                      code: { type: string }
                      pack_size: { type: string }
                      price: { type: integer, description: pence }
      responses: { '201': { description: Created }, '400': { description: Invalid } }

  /admin/catalogue/{id}:
    put:
      tags: [Admin]
      summary: Update a catalogue item
      operationId: adminUpdateCatalogueItem
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated } }
    delete:
      tags: [Admin]
      summary: Delete a catalogue item
      operationId: adminDeleteCatalogueItem
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Deleted } }

  /admin/purchase-carts/generate:
    post:
      tags: [Order Creation]
      summary: Generate per-supplier carts from selected supply requests
      description: Sources the best & cheapest offer per item, aggregates, and splits by supplier into draft carts.
      operationId: generatePurchaseCarts
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_ids]
              properties:
                request_ids: { type: array, items: { type: string } }
      responses: { '201': { description: Draft carts created }, '400': { description: No requests selected } }

  /admin/purchase-carts:
    get:
      tags: [Order Creation]
      summary: List generated carts
      operationId: adminListPurchaseCarts
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: Carts } }

  /admin/purchase-carts/{id}:
    get:
      tags: [Order Creation]
      summary: Get a generated cart
      operationId: adminGetPurchaseCart
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Cart }, '404': { description: Not found } }
    put:
      tags: [Order Creation]
      summary: Edit a draft cart (override lines + recipient)
      operationId: adminUpdatePurchaseCart
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_email: { type: string }
                lines: { type: array, items: { type: object } }
      responses: { '200': { description: Updated }, '400': { description: Sent carts cannot be edited } }

  /admin/purchase-carts/{id}/exported:
    post:
      tags: [Order Creation]
      summary: Record the browser extension's Gompels fill results; mark cart sent
      description: Posted by the extension after filling the Gompels cart — marks the cart sent, flips covered requests to ordered, stores per-line results.
      operationId: exportedPurchaseCart
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      status: { type: string, enum: [added, failed, not_found] }
                      resolved_code: { type: string }
                      catalogue_item_id: { type: string }
                      picked_name: { type: string }
                      searched: { type: boolean }
                      substituted: { type: boolean }
                      qty: { type: integer }
                supplier_order_ref: { type: string, description: best-effort Gompels basket/order ref }
      responses: { '200': { description: Recorded } }

  /admin/purchase-carts/{id}/fulfillment:
    patch:
      tags: [Order Creation]
      summary: Set supplier order ref + expected delivery date on a placed order
      description: Records delivery tracking and propagates the expected date to the covered staff requests. Only valid once the order has been placed.
      operationId: updatePurchaseCartFulfillment
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                supplier_order_ref: { type: string }
                tracking_number: { type: string, description: Carrier tracking number }
                expected_delivery_date: { type: string, format: date-time, nullable: true }
                order_total: { type: integer, description: "Actual amount paid, in pence (feeds spend analytics)" }
      responses: { '200': { description: Updated }, '400': { description: Order not yet placed } }

  /admin/purchase-carts/{id}/attachment:
    post:
      tags: [Order Creation]
      summary: Attach an order confirmation / invoice to a placed order
      description: Multipart upload (field `file`) — pdf/jpg/png/webp/gif/csv, up to 15 MB. Stored under /uploads and referenced on the cart.
      operationId: addPurchaseCartAttachment
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Attached, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseCart' } } } }
        '400': { description: Order not yet placed / unsupported type }

  /admin/purchase-carts/{id}/status:
    patch:
      tags: [Order Creation]
      summary: Apply a manual workflow transition to a purchase order
      description: >-
        Moves the order through the lifecycle (placed → tracking → dispatched →
        completed, or cancelled) from the board / stepper. Setting `completed`
        stamps `completed_at`. Accepts the legacy `sent`/`ordered` values.
      operationId: updatePurchaseCartStatus
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, placed, tracking, dispatched, partially_received, received, completed, cancelled, failed]
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseCart' } } } }
        '400': { description: Invalid status }

  /admin/purchase-carts/{id}/receive:
    post:
      tags: [Order Creation]
      summary: Record per-line goods received; advance status
      description: Sets per-line received quantities and moves the order to partially_received or received (flipping covered requests to received on full receipt).
      operationId: receivePurchaseCart
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      code: { type: string }
                      name: { type: string }
                      qty_received: { type: integer }
      responses: { '200': { description: Recorded }, '400': { description: Order not yet placed } }

  /admin/catalogue/learn:
    post:
      tags: [Admin]
      summary: Save a confirmed Gompels code for a product name (self-improving catalogue)
      operationId: learnCatalogue
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
                price: { type: integer, description: pence, optional }
      responses: { '200': { description: Saved/updated }, '400': { description: name and code required } }

  /order-templates:
    get:
      tags: [Order Requests]
      summary: List shared standing-order templates
      operationId: listOrderTemplates
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: Templates } }
    post:
      tags: [Order Requests]
      summary: Save a standing-order template
      operationId: createOrderTemplate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, items]
              properties:
                name: { type: string }
                branch_slug: { type: string }
                items: { type: array, items: { type: object } }
      responses: { '201': { description: Created }, '400': { description: Invalid } }

  /order-templates/{id}:
    delete:
      tags: [Order Requests]
      summary: Delete a standing-order template
      operationId: deleteOrderTemplate
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Deleted } }

  # ─────────────────────────────────────────────────────────────────────────────
  # Webhooks
  # ─────────────────────────────────────────────────────────────────────────────
  /webhooks/stripe:
    post:
      tags:
        - Webhooks
      summary: Stripe webhook handler
      description: Handle Stripe webhook events for payment processing
      operationId: handleStripeWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid webhook signature

  /admin/suppliers:
    get:
      tags: [Procurement]
      summary: List managed suppliers (vendor directory)
      operationId: listSuppliers
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Supplier' } } } } }
    post:
      tags: [Procurement]
      summary: Create a supplier
      operationId: createSupplier
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SupplierInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Supplier' } } } }
        '400': { description: Invalid payload }

  /admin/suppliers/{id}:
    get:
      tags: [Procurement]
      summary: Get a supplier
      operationId: getSupplier
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Supplier' } } } }
        '404': { description: Not found }
    put:
      tags: [Procurement]
      summary: Update a supplier
      operationId: updateSupplier
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SupplierInput' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Supplier' } } } }
        '400': { description: Invalid payload }
    delete:
      tags: [Procurement]
      summary: Delete a supplier
      operationId: deleteSupplier
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }

  /admin/procurement/analytics:
    get:
      tags: [Procurement]
      summary: Server-side procurement analytics roll-up
      description: Aggregates spend (by supplier / branch / month), request & order status counts, item demand and lead times across the procurement pipeline.
      operationId: getProcurementAnalytics
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProcurementAnalytics' } } } }

  # ─────────────────────────────────────────────────────────────────────────────
  # Organisations (multi-tenant)
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/organisations:
    get:
      tags: [Organisations]
      summary: List all organisations (platform operator only)
      operationId: listOrganisations
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Organisation' } } } } }
        '403': { description: Platform operator only }
    post:
      tags: [Organisations]
      summary: Create an organisation (+ optionally provision its first super-admin)
      operationId: createOrganisation
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string }
                name: { type: string }
                plan: { type: string }
                branding: { $ref: '#/components/schemas/OrgBranding' }
                domains: { type: array, items: { type: string } }
                settings: { $ref: '#/components/schemas/OrgSettings' }
                admin_email: { type: string, format: email, description: Optional first-admin provisioning }
                admin_password: { type: string }
                admin_first_name: { type: string }
                admin_last_name: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Organisation' } } } }
        '400': { description: Invalid payload }

  /admin/organisations/{id}:
    get:
      tags: [Organisations]
      summary: Get one organisation (platform)
      operationId: getOrganisation
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Organisation' } } } }
        '404': { description: Not found }
    put:
      tags: [Organisations]
      summary: Update an organisation (platform)
      operationId: updateOrganisation
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                plan: { type: string }
                status: { type: string, enum: [active, suspended, archived] }
                branding: { $ref: '#/components/schemas/OrgBranding' }
                domains: { type: array, items: { type: string } }
                settings: { $ref: '#/components/schemas/OrgSettings' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Organisation' } } } }
        '400': { description: Invalid payload }

  /admin/organisation:
    get:
      tags: [Organisations]
      summary: Get the caller's own organisation
      operationId: getOwnOrganisation
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Organisation' } } } }
    put:
      tags: [Organisations]
      summary: Update own org profile (name, branding, settings only)
      description: An org's own super-admin editing their organisation. Slug, plan, status and domains are platform-controlled.
      operationId: updateOwnOrganisation
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                branding: { $ref: '#/components/schemas/OrgBranding' }
                settings: { $ref: '#/components/schemas/OrgSettings' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Organisation' } } } }
        '400': { description: Invalid payload }

  # ─────────────────────────────────────────────────────────────────────────────
  # Children (permission children.manage)
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/children:
    get:
      tags: [Children]
      summary: List children
      operationId: listChildren
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: branch, in: query, required: false, schema: { type: string } }
        - { name: room_id, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, waitlist, left] } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Child' } } } } }
    post:
      tags: [Children]
      summary: Create a child
      operationId: createChild
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Child' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Child' } } } }
        '400': { description: Invalid payload }

  /admin/children/stats:
    get:
      tags: [Children]
      summary: Children / occupancy stats
      operationId: getChildStats
      security: [{ BearerAuth: [] }]
      parameters: [{ name: branch, in: query, required: false, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChildStats' } } } }

  /admin/children/{id}:
    get:
      tags: [Children]
      summary: Get a child
      operationId: getChild
