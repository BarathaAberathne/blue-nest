      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: List of comments }
    post:
      tags: [Blog]
      summary: Add a comment to a blog post
      operationId: addBlogComment
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author, content]
              properties:
                author: { type: string }
                content: { type: string }
      responses:
        '201': { description: Comment added }
        '400': { description: Invalid payload }

  /blog/posts/{slug}/like:
    post:
      tags: [Blog]
      summary: Like a blog post
      operationId: likeBlogPost
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Liked }

  # ─────────────────────────────────────────────────────────────────────────────
  # My Profile (self-service /me hub)
  # ─────────────────────────────────────────────────────────────────────────────
  /me/profile:
    get:
      tags: [My Profile]
      summary: Own staff record (resolved via Staff.UserID, with computed room projection)
      operationId: getMyProfile
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Staff' } } } }
        '404': { description: No staff record linked to this login }
    put:
      tags: [My Profile]
      summary: Self-edit the safe subset (contact, qualifications, emergency contacts, DBS, first aid)
      description: Employment fields (name/branch/role/status/type/hours/allowances/PIN) stay manager-controlled.
      operationId: updateMyProfile
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeProfileUpdate' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Staff' } } } }

  /me/attendance:
    get:
      tags: [My Profile]
      summary: Own attendance records + absence summary for a date range
      operationId: getMyAttendance
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  records: { type: array, items: { $ref: '#/components/schemas/StaffAttendanceRecord' } }
                  summary: { type: object, description: StaffAbsenceSummary (per-type leave/sick/absence day counts) }

  /me/rota:
    get:
      tags: [My Profile]
      summary: Own rostered shifts for a date range
      operationId: getMyRota
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Shift' } } } } }

  /me/notification-preferences:
    get:
      tags: [My Profile, Notifications]
      summary: Own notification email preferences (catalogue + muted types)
      description: In-app notifications always appear; muted_types lists the notification types NOT emailed. Absent preferences = every type emailed.
      operationId: getMyNotificationPreferences
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
    put:
      tags: [My Profile, Notifications]
      summary: Update own muted notification types
      description: Unknown types are dropped and duplicates collapsed (whitelisted to the catalogue). An empty list restores the default (everything emailed).
      operationId: updateMyNotificationPreferences
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [muted_types]
              properties:
                muted_types: { type: array, items: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }

  # ─────────────────────────────────────────────────────────────────────────────
  # Leave / holiday requests
  # ─────────────────────────────────────────────────────────────────────────────
  /leave-requests:
    post:
      tags: [Leave]
      summary: Apply for leave (self-service; managers may pass an explicit staff_id)
      description: Blocks over-allowance requests for capped types (annual + configured sick) and overlaps with the applicant's own pending/approved leave.
      operationId: applyLeaveRequest
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestInput' }
      responses:
        '201': { description: Created (status pending), content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }
        '400': { description: Bad range / over allowance / overlapping own leave }

  /leave-requests/me:
    get:
      tags: [Leave]
      summary: Own leave requests
      operationId: listMyLeaveRequests
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } } } } }

  /leave-requests/balance:
    get:
      tags: [Leave]
      summary: Own leave balances, keyed by leave type (UK Apr–Mar leave year)
      operationId: getMyLeaveBalance
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: '#/components/schemas/LeaveBalance' }

  /leave-requests/{id}/cancel:
    patch:
      tags: [Leave]
      summary: Cancel own pending leave request
      operationId: cancelLeaveRequest
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }

  /admin/leave-requests:
    get:
      tags: [Leave]
      summary: Leave requests queue (branch-scoped via policy.EffectiveBranch; permission leave.approve)
      operationId: listLeaveRequests
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: branch, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, declined, cancelled] } }
        - { name: staff_id, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } } } } }
    post:
      tags: [Leave]
      summary: Manager files leave for a staff member (staff_id in body; still pending until a DIFFERENT manager approves)
      operationId: adminCreateLeaveRequest
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestInput' }
      responses:
        '201': { description: Created (status pending), content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }

  /admin/leave-requests/export:
    get:
      tags: [Leave, Exports]
      summary: Export the leave-requests list (CSV default, ?format=xlsx for Excel)
      operationId: exportLeaveRequests
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: branch, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: staff_id, in: query, required: false, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, xlsx, excel], default: csv } }
      responses:
        '200': { description: Attachment (text/csv or application/vnd.openxmlformats-officedocument.spreadsheetml.sheet) }

  /admin/leave-requests/{id}/approve:
    post:
      tags: [Leave]
      summary: Approve a leave request (four-eyes — reviewer must differ from applicant)
      description: On approval the booked weekdays are written to the staff-attendance register.
      operationId: approveLeaveRequest
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }
        '400': { description: Self-approval blocked / not pending }

  /admin/leave-requests/{id}/decline:
    post:
      tags: [Leave]
      summary: Decline a leave request (reason required; four-eyes)
      operationId: declineLeaveRequest
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Declined, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }

  # ─────────────────────────────────────────────────────────────────────────────
  # In-app notifications
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/notifications:
    get:
      tags: [Notifications]
      summary: Caller's own recent notifications + unread count
      operationId: listMyNotifications
      security: [{ BearerAuth: [] }]
      parameters: [{ name: limit, in: query, required: false, schema: { type: integer, default: 30 } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AppNotification' } }
                  unread: { type: integer }

  /admin/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all own notifications read
      operationId: markAllNotificationsRead
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK }

  /admin/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one own notification read
      operationId: markNotificationRead
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  # ─────────────────────────────────────────────────────────────────────────────
  # List exports (CSV default, ?format=xlsx|excel for Excel)
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/children/export:
    get:
