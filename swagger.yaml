        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: dir, in: query, required: false, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: skip, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Enquiry' } } } } }
    post:
      tags: [Enquiries]
      summary: Log an off-website enquiry (phone/walk-in/referral) — no consent gate, no auto-email
      operationId: adminCreateEnquiry
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                branch: { type: string }
                child_age: { type: string }
                enquiry_type: { type: string }
                message: { type: string }
                source: { type: string, description: "phone | walk_in | email | referral | social | event | other" }
                priority: { type: string, enum: [low, medium, high] }
                assigned_to: { type: string }
                assigned_to_name: { type: string }
                note: { type: string, description: Optional opening internal note }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Enquiry' } } } }
        '400': { description: Invalid payload }

  /admin/enquiries/page:
    get:
      tags: [Enquiries]
      summary: Paginated enquiry table (items + total for page-count maths)
      operationId: adminListEnquiriesPage
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: branch, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: assigned_to, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: dir, in: query, required: false, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: skip, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Enquiry' } }
                  total: { type: integer }
                  limit: { type: integer }
                  skip: { type: integer }

