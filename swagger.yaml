        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, xlsx, excel], default: csv } }
      responses:
        '200': { description: Attachment (text/csv or application/vnd.openxmlformats-officedocument.spreadsheetml.sheet) }

  /admin/staff/export:
    get:
      tags: [Staff, Exports]
      summary: Export the staff list (same filters + branch scope as the list)
      operationId: exportStaff
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: branch, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, xlsx, excel], default: csv } }
      responses:
        '200': { description: Attachment (text/csv or application/vnd.openxmlformats-officedocument.spreadsheetml.sheet) }

  /admin/enquiries/export:
    get:
      tags: [Enquiries, Exports]
      summary: Export the enquiries list (same filters + branch scope as the list)
      operationId: exportEnquiries
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: branch, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, xlsx, excel], default: csv } }
      responses:
        '200': { description: Attachment (text/csv or application/vnd.openxmlformats-officedocument.spreadsheetml.sheet) }

  /admin/staff-attendance/export:
    get:
      tags: [Staff Attendance, Exports]
      summary: Export the attendance register for a date + branch
      operationId: exportStaffAttendance
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: branch, in: query, required: false, schema: { type: string } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv, xlsx, excel], default: csv } }
      responses:
        '200': { description: Attachment (text/csv or application/vnd.openxmlformats-officedocument.spreadsheetml.sheet) }

  # ─────────────────────────────────────────────────────────────────────────────
  # Room allocation (effective-dated assignments — the canonical room model)
  # ─────────────────────────────────────────────────────────────────────────────
  /admin/child-room-assignments:
    post:
      tags: [Room Assignments]
      summary: Allocate a child to a room (enforces same-branch + active + capacity + age; overrides need override_reason)
      operationId: createChildRoomAssignment
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomAssignmentInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RoomAssignment' } } } }
        '400': { description: Capacity/age/branch rule violated without override_reason }

  /admin/child-room-assignments/{id}:
    patch:
      tags: [Room Assignments]
      summary: End a child's room assignment
      operationId: endChildRoomAssignment
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Ended, content: { application/json: { schema: { $ref: '#/components/schemas/RoomAssignment' } } } }

  /admin/children/{id}/room-assignments:
    get:
      tags: [Room Assignments]
      summary: A child's assignment history
      operationId: listChildRoomAssignments
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoomAssignment' } } } } }

  /admin/children/{id}/transfer-room:
    post:
      tags: [Room Assignments]
      summary: Transfer a child to another room (closes the old assignment, opens a new one; future-dated → scheduled)
      operationId: transferChildRoom
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomAssignmentInput' }
      responses:
        '200': { description: Transferred, content: { application/json: { schema: { $ref: '#/components/schemas/RoomAssignment' } } } }

  /admin/staff-room-assignments:
    post:
      tags: [Room Assignments]
      summary: Assign a staff member to a room
      operationId: createStaffRoomAssignment
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomAssignmentInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RoomAssignment' } } } }

  /admin/staff-room-assignments/{id}:
    patch:
      tags: [Room Assignments]
      summary: Update / end a staff room assignment
      operationId: updateStaffRoomAssignment
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RoomAssignment' } } } }

  /admin/staff/{id}/room-assignments:
    get:
      tags: [Room Assignments]
      summary: A staff member's assignment history
      operationId: listStaffRoomAssignments
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoomAssignment' } } } } }

  /admin/rooms/capacity:
    get:
      tags: [Room Assignments, Rooms]
      summary: Per-room capacity/occupancy summary for a branch
      operationId: getRoomsCapacity
      security: [{ BearerAuth: [] }]
      parameters: [{ name: branch, in: query, required: false, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /admin/rooms/{id}/capacity:
    get:
      tags: [Room Assignments, Rooms]
      summary: One room's capacity/occupancy detail
      operationId: getRoomCapacity
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }

  /admin/children/capacity-forecast:
    get:
      tags: [Room Assignments, Children]
      summary: Forward occupancy / room-move forecast
      operationId: getCapacityForecast
      security: [{ BearerAuth: [] }]
      parameters: [{ name: branch, in: query, required: false, schema: { type: string } }]
      responses:
        '200': { description: OK }

  # ─────────────────────────────────────────────────────────────────────────────
  # Configuration — taxonomy lists, terms, fees, branch + email templates
  # ─────────────────────────────────────────────────────────────────────────────
  /taxonomy:
    get:
      tags: [Configuration]
      summary: Public taxonomy list (pinned to the default tenant; feeds the application form)
      operationId: listPublicTaxonomy
      parameters:
        - { name: category, in: query, required: false, schema: { type: string, enum: [session_type, allergy_type, dietary_label, age_group] } }
        - { name: branch, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } } } } }

  /admin/taxonomy:
    get:
      tags: [Configuration]
      summary: List taxonomy terms (with ?branch = picker view of active terms + org-wide defaults; without = management view)
      operationId: listTaxonomy
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: branch, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaxonomyTerm' } } } } }
    post:
      tags: [Configuration]
      summary: Create a taxonomy term (permission branches.manage)
      operationId: createTaxonomyTerm
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyTerm' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TaxonomyTerm' } } } }

  /admin/taxonomy/{id}:
    get:
      tags: [Configuration]
      summary: Get a taxonomy term
      operationId: getTaxonomyTerm
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaxonomyTerm' } } } }
    put:
      tags: [Configuration]
      summary: Update a taxonomy term (permission branches.manage)
      operationId: updateTaxonomyTerm
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxonomyTerm' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TaxonomyTerm' } } } }
    delete:
      tags: [Configuration]
      summary: Delete a taxonomy term (permission branches.manage)
      operationId: deleteTaxonomyTerm
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Deleted }

  /admin/terms:
    get:
      tags: [Configuration]
      summary: List term dates (optionally for one branch)
      operationId: listTerms
      security: [{ BearerAuth: [] }]
      parameters: [{ name: branch, in: query, required: false, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Term' } } } } }
    post:
      tags: [Configuration]
      summary: Create a term (permission branches.manage)
      operationId: createTerm
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Term' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Term' } } } }

  /admin/terms/{id}:
    get:
      tags: [Configuration]
      summary: Get a term
      operationId: getTerm
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Term' } } } }
    put:
      tags: [Configuration]
      summary: Update a term (permission branches.manage)
      operationId: updateTerm
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Term' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Term' } } } }
    delete:
      tags: [Configuration]
      summary: Delete a term (permission branches.manage)
      operationId: deleteTerm
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Deleted }

  /fee-config:
    get:
      tags: [Configuration]
      summary: Public fee-schedule bundle for the fee calculator (pinned to the default tenant)
      operationId: getPublicFeeConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  branches: { type: object, description: Per-branch rate grids keyed by branch slug }
                  meta: { type: object, description: Org-wide extra-hour/swap/late-fee pricing + disclaimer }

  /admin/fee-config:
    get:
      tags: [Configuration]
      summary: Full fee-config bundle for the admin editor
      operationId: listFeeConfig
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK }
    put:
      tags: [Configuration]
      summary: Update the org-wide fee meta (ancillary pricing + disclaimer; permission branches.manage)
      operationId: updateFeeMeta
      security: [{ BearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Updated }

  /admin/fee-config/{branch}:
    put:
      tags: [Configuration]
      summary: Update one branch's fee schedule (permission branches.manage; the branch must exist)
      operationId: updateBranchFeeConfig
      security: [{ BearerAuth: [] }]
      parameters: [{ name: branch, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Updated }
        '400': { description: Unknown branch }
    delete:
      tags: [Configuration]
      summary: Delete a branch's fee schedule, including orphan docs whose branch was archived/deleted (permission branches.manage)
      operationId: deleteBranchFeeConfig
      security: [{ BearerAuth: [] }]
      parameters: [{ name: branch, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '404': { description: No fee config for that branch }

  /admin/branch-templates:
    get:
      tags: [Configuration]
      summary: List branch setup templates
      operationId: listBranchTemplates
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BranchTemplate' } } } } }
    post:
      tags: [Configuration]
      summary: Create a branch template (permission branches.manage)
      operationId: createBranchTemplate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchTemplate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BranchTemplate' } } } }

  /admin/branch-templates/{id}:
    get:
      tags: [Configuration]
      summary: Get a branch template
      operationId: getBranchTemplate
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BranchTemplate' } } } }
    put:
      tags: [Configuration]
      summary: Update a branch template (permission branches.manage)
      operationId: updateBranchTemplate
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchTemplate' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/BranchTemplate' } } } }
    delete:
      tags: [Configuration]
      summary: Delete a branch template (permission branches.manage)
      operationId: deleteBranchTemplate
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Deleted }

  /admin/branch-templates/{id}/apply:
    post:
      tags: [Configuration]
      summary: Apply a template's rooms to a branch (skips rooms whose name exists — re-runnable)
      operationId: applyBranchTemplate
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_slug]
              properties:
                branch_slug: { type: string }
      responses:
        '200': { description: Applied (rooms created/skipped counts) }

  /admin/branch-templates/from-branch:
    post:
      tags: [Configuration]
      summary: Capture an existing branch's rooms into a new template
      operationId: createBranchTemplateFromBranch
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_slug, name]
              properties:
                branch_slug: { type: string }
                name: { type: string }
                description: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BranchTemplate' } } } }

  /admin/email-templates:
    get:
      tags: [Configuration]
      summary: Email-template catalogue with each template's current (custom or default) state
      operationId: listEmailTemplates
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EmailTemplate' } } } } }

  /admin/daily-records/{id}/approve:
    post:
      tags: [Daily Records]
      summary: Approve a pending daily log (four-eyes — approver must differ from submitter; permission daily_logs.approve)
      operationId: approveDailyRecord
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/DailyRecord' } } } }
        '400': { description: Self-approval blocked / not pending }

  /admin/daily-records/{id}/reject:
    post:
      tags: [Daily Records]
      summary: Reject a pending daily log (reason required; permission daily_logs.approve)
      operationId: rejectDailyRecord
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/DailyRecord' } } } }

  /admin/rooms/{id}/status:
    patch:
      tags: [Rooms]
      summary: Set a room's status (active/inactive)
      operationId: setRoomStatus
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
      responses:
        '200': { description: Updated }

  /admin/rooms/{id}/children:
    get:
      tags: [Room Assignments, Rooms]
      summary: Children currently assigned to a room
      operationId: listRoomChildren
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoomAssignment' } } } } }

  /admin/rooms/{id}/staff:
    get:
      tags: [Room Assignments, Rooms]
      summary: Staff currently assigned to a room
      operationId: listRoomStaff
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoomAssignment' } } } } }

  /integrations/gbp/digest:
    post:
      tags: [Webhooks]
      summary: Google Business Profile reviews-digest ingest (shared-secret webhook, no user JWT)
      operationId: ingestGBPDigest
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Ingested }
        '401': { description: Bad shared secret }

  /admin/email-templates/{key}:
    put:
      tags: [Configuration]
      summary: Customise a transactional email's subject/body (permission branches.manage)
      description: Body is the message text with {{placeholders}}; the service wraps it in the branded shell. A template only overrides the built-in default once customised.
      operationId: updateEmailTemplate
      security: [{ BearerAuth: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string, example: enquiry_acknowledgement } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string }
                body: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/EmailTemplate' } } } }
    delete:
      tags: [Configuration]
      summary: Revert a template to the built-in default (permission branches.manage)
      operationId: revertEmailTemplate
      security: [{ BearerAuth: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Reverted }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    KioskAuth:
      type: apiKey
      in: header
      name: X-Kiosk-Token
      description: Per-device kiosk token (entrance tablet). Scopes access to session/search/clock-in/clock-out within the device's branch only.

  schemas:
    # ─────────────────────────────────────────────────────────────────────────
    # User & Auth
    # ─────────────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        email:
          type: string
          format: email
          example: user@example.com
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        role:
          type: string
          enum: [customer, staff, branch_manager, finance, admissions, procurement, admin, super_admin]
          example: customer
        branch_slugs:
          type: array
          items:
            type: string
          example: ["borehamwood", "harrow"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    # ─────────────────────────────────────────────────────────────────────────
    # Products
    # ─────────────────────────────────────────────────────────────────────────
    Product:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        slug:
          type: string
          example: wooden-toy-set
        name:
          type: string
          example: Wooden Toy Set
        description:
          type: string
          example: A beautiful wooden toy set for children
        price:
          type: integer
          description: Price in pence/cents
          example: 2999
        currency:
          type: string
          example: GBP
        category_id:
          type: string
          example: 507f1f77bcf86cd799439011
        image_url:
          type: string
          example: https://example.com/images/toy.jpg
        stock_qty:
          type: integer
          example: 50
        is_active:
          type: boolean
          example: true
        branch_slugs:
          type: array
          items:
            type: string
          example: ["borehamwood", "harrow"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        - slug
        - name
        - price
        - category_id
      properties:
        slug:
          type: string
          example: wooden-toy-set
        name:
          type: string
          example: Wooden Toy Set
        description:
          type: string
          example: A beautiful wooden toy set for children
        price:
          type: integer
          example: 2999
        currency:
          type: string
          default: GBP
        category_id:
          type: string
          example: 507f1f77bcf86cd799439011
        image_url:
          type: string
        stock_qty:
          type: integer
          default: 0
        is_active:
          type: boolean
          default: true
        branch_slugs:
          type: array
          items:
            type: string

    Category:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        slug:
          type: string
          example: toys
        name:
          type: string
          example: Toys
        created_at:
          type: string
          format: date-time

    CategoryInput:
      type: object
      required:
        - name
      properties:
        slug:
          type: string
          example: toys
        name:
          type: string
          example: Toys

    # ─────────────────────────────────────────────────────────────────────────
    # Blog
    # ─────────────────────────────────────────────────────────────────────────
    BlogPost:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        slug:
          type: string
          example: my-first-post
        title:
          type: string
          example: My First Post
        excerpt:
          type: string
          example: This is a short excerpt of the post
        body:
          type: string
          example: Full HTML content of the blog post
        author_id:
          type: string
          example: 507f1f77bcf86cd799439011
        author_name:
          type: string
          example: John Doe
        cover_image:
          type: string
          example: https://example.com/images/post.jpg
        tags:
          type: array
          items:
            type: string
          example: ["education", "montessori"]
        branch_slugs:
          type: array
          items:
            type: string
          example: ["borehamwood"]
        published:
          type: boolean
          example: true
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BlogPostInput:
      type: object
      required:
        - slug
        - title
        - body
      properties:
        slug:
          type: string
          example: my-first-post
        title:
          type: string
          example: My First Post
        excerpt:
          type: string
        body:
          type: string
        author_name:
          type: string
        cover_image:
          type: string
        tags:
          type: array
          items:
            type: string
        branch_slugs:
          type: array
          items:
            type: string
        published:
          type: boolean
          default: false

    # ─────────────────────────────────────────────────────────────────────────
    # Branches
    # ─────────────────────────────────────────────────────────────────────────
    Branch:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        slug:
          type: string
          example: borehamwood
        name:
          type: string
          example: Blue Nest Montessori - Borehamwood
        status:
          type: string
          enum: [active, coming_soon]
          example: active
        short_description:
          type: string
          example: A nurturing environment for children
        hero_image_url:
          type: string
          example: https://example.com/images/branch.jpg
        contact:
          $ref: '#/components/schemas/BranchContact'
        admissions:
          $ref: '#/components/schemas/BranchAdmissions'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BranchContact:
      type: object
      properties:
        phone:
          type: string
          example: +44 20 1234 5678
        email:
          type: string
          format: email
          example: borehamwood@blue-nest.com
        address:
          type: string
          example: 123 Main Street, Borehamwood
        map_url:
          type: string
          example: https://maps.google.com/...

    BranchAdmissions:
      type: object
      properties:
        age_range:
          type: string
          example: 0-6 years
        opening_time:
          type: string
          example: 07:00
        closing_time:
          type: string
          example: 18:00
        notes:
          type: string

    # ─────────────────────────────────────────────────────────────────────────
    # Cart
    # ─────────────────────────────────────────────────────────────────────────
    Cart:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        user_id:
          type: string
          example: 507f1f77bcf86cd799439011
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        product_id:
          type: string
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          example: Wooden Toy Set
        price:
          type: integer
          example: 2999
        qty:
          type: integer
          example: 2
        image_url:
          type: string
          example: https://example.com/images/toy.jpg

    # ─────────────────────────────────────────────────────────────────────────
    # Orders
    # ─────────────────────────────────────────────────────────────────────────
    Order:
      type: object
      properties:
        id:
          type: string
          example: 507f1f77bcf86cd799439011
        ref:
          type: string
          description: Human sequential reference
          example: ORD-2026-000042
        user_id:
          type: string
          example: 507f1f77bcf86cd799439011
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [pending, paid, processing, shipped, delivered, cancelled]
          example: paid
        total_amount:
          type: integer
          example: 5998
        currency:
          type: string
          example: GBP
        customer_name: { type: string, description: "Customer snapshot at purchase" }
        customer_email: { type: string, format: email }
        customer_phone: { type: string }
        branch_slug: { type: string, description: "'' or 'n/a' = Not applicable" }
        branch_name: { type: string }
        child_ref: { type: string, description: "Optional child name / reference" }
        shipping_address:
          $ref: '#/components/schemas/ShippingAddress'
        billing_address:
          $ref: '#/components/schemas/ShippingAddress'
        payment_status:
          type: string
          enum: [unpaid, paid, failed, refunded]
        stripe_customer_id: { type: string }
        stripe_session_id:
          type: string
          example: cs_test_abc123
        payment_intent_id: { type: string, example: pi_abc123 }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      properties:
        product_id:
          type: string
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          example: Wooden Toy Set
        price:
          type: integer
          example: 2999
        qty:
          type: integer
          example: 2
        size: { type: string, description: "Age/size variant" }
        vat: { type: integer, description: "Per-line VAT in pence (0 for zero-rated items)" }

    ShippingAddress:
      type: object
      description: Used for both delivery and billing addresses.
      properties:
        name:
          type: string
        line1:
          type: string
          example: 123 Main Street
        line2:
          type: string
        city:
          type: string
          example: London
        county:
          type: string
          example: Greater London
        postal_code:
          type: string
          example: AB12CD
        country:
          type: string
          example: GB
        phone:
          type: string

    OrderRequestItem:
      type: object
      properties:
        item_name: { type: string, example: A4 Sugar Paper (white) }
        supplier: { type: string, enum: [Gompels, Amazon, Other], example: Gompels }
        qty: { type: integer, example: 5 }
        notes: { type: string }
        code: { type: string, description: Supplier SKU when picked from the catalogue, example: PAP123 }
        catalogue_item_id: { type: string, description: Links the line to a catalogue item when known }

    OrderRequest:
      type: object
      description: A staff-submitted supply request that management reviews and converts into purchase orders.
      properties:
        id: { type: string, example: 507f1f77bcf86cd799439011 }
        ref: { type: string, description: Human sequential reference, example: SR-2026-000045 }
        user_id: { type: string }
        requested_by_name: { type: string, example: Jane Practitioner }
        requested_by_email: { type: string, format: email }
        branch_slug: { type: string, example: borehamwood }
        classroom: { type: string, example: Toddler Room }
        priority: { type: string, enum: [low, normal, high, urgent], example: normal }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderRequestItem' }
        status:
          type: string
          enum: [pending, approved, converted_to_po, ordered, received, cancelled]
          example: pending
        notes: { type: string }
        expected_delivery_date: { type: string, format: date-time, nullable: true, description: Propagated from the covering purchase order; staff never see prices }
        delivered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        branch_slug: { type: string, example: borehamwood }
        classroom: { type: string, example: Toddler Room }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        notes: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderRequestItem' }

    PurchaseCartLine:
      type: object
      properties:
        item_name: { type: string }
        code: { type: string, description: Resolved supplier SKU }
        qty: { type: integer }
        unit_price: { type: integer, description: Pence }
        line_total: { type: integer, description: Pence }
        qty_received: { type: integer, description: Goods received against this line }

    PurchaseCart:
      type: object
      description: A draft/placed supplier order generated from supply requests by the sourcing engine.
      properties:
        id: { type: string }
        ref: { type: string, description: Human sequential reference, example: PO-2026-000123 }
        supplier: { type: string, enum: [Gompels, Amazon, Other] }
        branch_slug: { type: string }
        classroom: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent] }
        recipient_email: { type: string, format: email }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseCartLine' }
        subtotal: { type: integer, description: "Pence — catalogue-price estimate" }
        order_total: { type: integer, description: "Pence — actual amount paid (post-placement); analytics uses this over subtotal" }
        attachments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
              uploaded_at: { type: string, format: date-time }
        status:
          type: string
          enum: [draft, placed, tracking, dispatched, partially_received, received, completed, cancelled, failed]
          description: Legacy `sent`/`ordered` read as `placed`.
        source_request_ids:
          type: array
          items: { type: string }
        supplier_order_ref: { type: string }
        tracking_number: { type: string, description: Carrier tracking number }
        expected_delivery_date: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Supplier:
      type: object
      description: A managed vendor in the procurement directory.
      properties:
        id: { type: string }
        name: { type: string, example: Gompels HealthCare }
        slug: { type: string, example: gompels-healthcare }
        category: { type: string, example: Hygiene & cleaning }
        contact_name: { type: string }
        contact_email: { type: string, format: email }
        contact_phone: { type: string }
        website: { type: string }
        order_email: { type: string, format: email, description: Where purchase orders are emailed }
        account_ref: { type: string, description: Our account / customer number }
        lead_time_days: { type: integer }
        notes: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        category: { type: string }
        contact_name: { type: string }
        contact_email: { type: string, format: email }
        contact_phone: { type: string }
        website: { type: string }
        order_email: { type: string, format: email }
        account_ref: { type: string }
        lead_time_days: { type: integer }
        notes: { type: string }
        is_active: { type: boolean, default: true }

    ProcurementAnalytics:
      type: object
      description: Server-side procurement roll-up. All spend figures are in pence.
      properties:
        total_requests: { type: integer }
        total_orders: { type: integer }
        total_spend: { type: integer, description: "Pence, across placed orders" }
        pending_requests: { type: integer }
        overdue_orders: { type: integer }
        request_status_counts: { type: object, additionalProperties: { type: integer } }
        order_status_counts: { type: object, additionalProperties: { type: integer } }
        spend_by_supplier:
          type: array
          items:
            type: object
            properties:
              supplier: { type: string }
              spend: { type: integer }
              orders: { type: integer }
        spend_by_branch:
          type: array
          items:
            type: object
            properties:
              branch: { type: string }
              spend: { type: integer }
        monthly_spend:
          type: array
          items:
            type: object
            properties:
              month: { type: string, example: "2026-06" }
              spend: { type: integer }
        top_items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              qty: { type: integer }
              requests: { type: integer }
        avg_request_to_order_days: { type: number }
        avg_order_to_delivery_days: { type: number }

    DashboardWidget:
      type: object
      properties:
        key: { type: string, example: recent-orders }
        hidden: { type: boolean }
        size: { type: string, enum: [normal, wide] }

    DashboardLayout:
      type: object
      description: A per-user saved arrangement of the admin dashboard widgets.
      properties:
        id: { type: string }
        user_id: { type: string }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/DashboardWidget' }
        updated_at: { type: string, format: date-time }

    # ─────────────────────────────────────────────────────────────────────────
    # Organisations (multi-tenant)
    # ─────────────────────────────────────────────────────────────────────────
    OrgBranding:
      type: object
      description: Per-tenant brand so each org renders as itself.
      properties:
        logo_url: { type: string }
        primary_color: { type: string, example: "#36A9FF" }
        accent_color: { type: string, example: "#D6B36A" }

    OrgSettings:
      type: object
      description: Per-org configuration + enabled capability flags.
      properties:
        timezone: { type: string, example: Europe/London }
        currency: { type: string, example: GBP }
        features:
          type: array
          items: { type: string }
          description: Enabled feature flags

    Organisation:
      type: object
      description: The top-level tenant — a nursery group that owns branches, users and all operational data.
      properties:
        id: { type: string }
        slug: { type: string, example: blue-nest }
        name: { type: string, example: Blue Nest Montessori }
        status: { type: string, enum: [active, suspended, archived] }
        plan: { type: string }
        branding: { $ref: '#/components/schemas/OrgBranding' }
        domains:
          type: array
          items: { type: string }
        settings: { $ref: '#/components/schemas/OrgSettings' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ─────────────────────────────────────────────────────────────────────────
    # Children & Rooms
    # ─────────────────────────────────────────────────────────────────────────
    Guardian:
      type: object
      properties:
        name: { type: string }
        relation: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        primary: { type: boolean }

    ChildSession:
      type: object
      description: A booked session in the weekly pattern.
      properties:
        day: { type: string, example: Mon }
        type: { type: string, enum: [full, am, pm] }

    Child:
      type: object
      description: An enrolled (or waitlisted) child — the occupancy / attendance source record.
      properties:
        id: { type: string }
        org_id: { type: string }
        ref: { type: string, example: CHD-2026-000045 }
        first_name: { type: string }
        last_name: { type: string }
        dob: { type: string, description: YYYY-MM-DD }
        gender: { type: string }
        branch_slug: { type: string }
        room_id: { type: string }
        status: { type: string, enum: [active, waitlist, left] }
        start_date: { type: string, description: YYYY-MM-DD }
        guardians:
          type: array
          items: { $ref: '#/components/schemas/Guardian' }
        funding_type: { type: string, enum: [none, 15h, 30h] }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/ChildSession' }
        allergies: { type: string }
        dietary_reqs: { type: string }
        medical_notes: { type: string }
        enquiry_id: { type: string, description: Originating admissions enquiry }
        key_person_id: { type: string, description: Staff record id of the child's key person }
        key_person_name: { type: string, description: Resolved for display; never stored }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChildStats:
      type: object
      description: Children / occupancy figures for the dashboard.
      properties:
        total: { type: integer }
        active: { type: integer }
        waitlist: { type: integer }
        capacity: { type: integer }
        available: { type: integer }
        occupancy_rate: { type: integer }
        by_branch:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: integer }
        by_age_group:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: integer }
        branches:
          type: array
          items:
            type: object
            properties:
              branch: { type: string }
              children: { type: integer }
              capacity: { type: integer }
              occupancy_rate: { type: integer }

    Room:
      type: object
      description: A class/room within a branch. Capacity + staff ratio drive occupancy figures.
      properties:
        id: { type: string }
        org_id: { type: string }
        branch_slug: { type: string }
        name: { type: string, example: Toddler Room }
        age_range: { type: string, example: 2-3 years }
        capacity: { type: integer }
        staff_ratio: { type: integer, description: "1 staff : N children" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ─────────────────────────────────────────────────────────────────────────
    # Staff (HR) & attendance
    # ─────────────────────────────────────────────────────────────────────────
    Staff:
      type: object
      description: An employed practitioner/manager (HR record; separate from the auth users collection).
      properties:
        id: { type: string }
        org_id: { type: string }
        ref: { type: string, example: STF-2026-000012 }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        branch_slug: { type: string }
        room_id: { type: string }
        job_title: { type: string }
        staff_type: { type: string, enum: [permanent, agency, bank] }
        status: { type: string, enum: [active, on_leave, inactive] }
        start_date: { type: string, description: YYYY-MM-DD }
        contract_hours: { type: number }
        qualifications:
          type: array
          items: { type: string }
        dbs_number: { type: string }
        dbs_expiry: { type: string, description: YYYY-MM-DD }
        first_aid_expiry: { type: string, description: YYYY-MM-DD }
        user_id: { type: string, description: Linked login account (empty = HR-only, no login) }
        has_pin: { type: boolean, description: Whether a kiosk clock-in PIN is set (PIN itself never serialised) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StaffAbsenceSummary:
      type: object
      description: One staff member's attendance over a date range (staff-profile absence card).
      properties:
        staff_id: { type: string }
        from: { type: string, description: YYYY-MM-DD inclusive }
        to: { type: string, description: YYYY-MM-DD inclusive }
        worked_days: { type: integer }
        worked_hours: { type: integer }
        late_days: { type: integer }
        sick_days: { type: integer }
        leave_days: { type: integer }
        training_days: { type: integer }
        absent_days: { type: integer }
        attendance_rate: { type: integer, description: "worked ÷ (worked + away + absent), %" }

    BreakEntry:
      type: object
      properties:
        start: { type: string, format: date-time, nullable: true }
        end: { type: string, format: date-time, nullable: true }

    AttendanceCorrection:
      type: object
      description: One append-only manager edit to an attendance record.
      properties:
        at: { type: string, format: date-time }
        actor_id: { type: string }
        actor_name: { type: string }
        field: { type: string }
        from: { type: string }
        to: { type: string }
        reason: { type: string }

    StaffAttendanceRecord:
      type: object
      description: One staff member's attendance for one day (authoritative source of worked hours for payroll).
      properties:
        id: { type: string }
        org_id: { type: string }
        staff_id: { type: string }
        staff_name: { type: string }
        branch_slug: { type: string }
        date: { type: string, description: YYYY-MM-DD }
        status: { type: string, enum: [expected, present, absent, leave, sick, training, meeting, remote] }
        clock_in: { type: string, format: date-time, nullable: true }
        clock_out: { type: string, format: date-time, nullable: true }
        late_arrival: { type: boolean }
        notes: { type: string }
        source: { type: string, enum: [kiosk, manual, import] }
        device_id: { type: string }
        ip: { type: string }
        location: { type: string }
        created_by: { type: string }
        breaks:
          type: array
          items: { $ref: '#/components/schemas/BreakEntry' }
        shift_id: { type: string }
        missing_clockout: { type: boolean }
        worked_minutes: { type: integer }
        break_minutes: { type: integer }
        overtime_minutes: { type: integer }
        late_minutes: { type: integer }
        early_departure_minutes: { type: integer }
        corrections:
          type: array
          items: { $ref: '#/components/schemas/AttendanceCorrection' }
        job_title: { type: string, description: Resolved for the register table; never persisted }
        room_name: { type: string, description: Resolved for the register table; never persisted }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AttendanceDaySummary:
      type: object
      description: Attendance dashboard KPI strip for a date + branch (company-wide when branch empty).
      properties:
        date: { type: string, description: YYYY-MM-DD }
        total: { type: integer }
        attended: { type: integer, description: Working (present) count — the rate numerator }
        currently_in: { type: integer }
        clocked_out: { type: integer }
        absent: { type: integer }
        on_leave: { type: integer }
        late: { type: integer }
        overtime_minutes: { type: integer }
        missing_clockout: { type: integer }
        attendance_rate: { type: integer }
        avg_arrival: { type: string, description: HH:MM }
        branches:
          type: array
          items:
            type: object
            properties:
              branch: { type: string }
              total: { type: integer }
              currently_in: { type: integer }
              attended: { type: integer }
              late: { type: integer }
              attendance_rate: { type: integer }

    # ─────────────────────────────────────────────────────────────────────────
    # Rota / Kiosk
    # ─────────────────────────────────────────────────────────────────────────
    Shift:
      type: object
      description: One planned working slot on the rota (staff → room / date / start–end).
      properties:
        id: { type: string }
        org_id: { type: string }
        staff_id: { type: string }
        staff_name: { type: string }
        branch_slug: { type: string }
        external: { type: boolean, description: Off-roster person with no staff record; never matches attendance }
        room_id: { type: string }
        room_name: { type: string }
        date: { type: string, description: YYYY-MM-DD }
        start_time: { type: string, description: HH:MM }
        end_time: { type: string, description: HH:MM }
        notes: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KioskDevice:
      type: object
      description: An entrance tablet registered to a branch, authenticating to the isolated /kiosk API with its own token.
      properties:
        id: { type: string }
        org_id: { type: string }
        name: { type: string, example: Harrow front entrance }
        branch_slug: { type: string }
        token_hint: { type: string, description: Last 4 chars of the token, for the admin list }
        active: { type: boolean }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ─────────────────────────────────────────────────────────────────────────
    # Enquiries / admissions CRM
    # ─────────────────────────────────────────────────────────────────────────
    EnquiryNote:
      type: object
      properties:
        id: { type: string }
        note: { type: string }
        author_id: { type: string }
        author_name: { type: string }
        created_at: { type: string, format: date-time }

    EnquiryActivity:
      type: object
      description: Append-only audit entry on the enquiry timeline.
      properties:
        id: { type: string }
        type: { type: string, enum: [status_change, note_added, email_reply, follow_up_updated, assigned, registered, created] }
        message: { type: string }
        from_status: { type: string }
        to_status: { type: string }
        author_id: { type: string }
        author_name: { type: string }
        created_at: { type: string, format: date-time }

    EnquiryRegistration:
      type: object
      properties:
        is_registered: { type: boolean }
        registration_date: { type: string, format: date-time, nullable: true }
        expected_start_date: { type: string, format: date-time, nullable: true }
        child_age_group: { type: string }
        room_allocation: { type: string }
        funding_type: { type: string }

    Enquiry:
      type: object
      description: An admissions enquiry moving through the CRM pipeline.
      properties:
        id: { type: string }
        org_id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        branch: { type: string }
        child_age: { type: string }
        enquiry_type: { type: string }
        message: { type: string }
        status: { type: string, enum: [new, contacted, awaiting_reply, booked_visit, visit_completed, registered, cancelled, lost, spam] }
        source: { type: string }
        assigned_to: { type: string }
        assigned_to_name: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        follow_up_date: { type: string, format: date-time, nullable: true }
        next_action: { type: string }
        notes:
          type: array
          items: { $ref: '#/components/schemas/EnquiryNote' }
        activity_log:
          type: array
          items: { $ref: '#/components/schemas/EnquiryActivity' }
        registration: { $ref: '#/components/schemas/EnquiryRegistration' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ─────────────────────────────────────────────────────────────────────────
    # Daily records / safeguarding
    # ─────────────────────────────────────────────────────────────────────────
    DailyRecord:
      type: object
      description: One dated practitioner entry against a child (or branch-wide).
      properties:
        id: { type: string }
        org_id: { type: string }
        ref: { type: string, example: LOG-2026-000045 }
        type: { type: string, enum: [observation, incident, safeguarding, medication, meal] }
        child_id: { type: string }
        child_name: { type: string }
        branch_slug: { type: string }
        room_id: { type: string }
        date: { type: string, description: YYYY-MM-DD }
        title: { type: string }
        detail: { type: string }
        status: { type: string, enum: [open, resolved, administered, logged] }
        severity: { type: string, enum: [low, medium, high], description: incident / safeguarding }
        author: { type: string }
        eyfs_areas:
          type: array
          items: { type: string }
          description: Observation-specific
        next_steps: { type: string, description: Observation-specific }
        medication: { type: string, description: Medication-specific }
        dose: { type: string, description: Medication-specific }
        meal_type: { type: string, enum: [breakfast, lunch, snack, tea], description: Meal-specific }
        eaten: { type: string, enum: [all, most, some, none], description: Meal-specific }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DailyStats:
      type: object
      description: Daily-records roll-up (Operations tiles + safeguarding KPI + Ofsted).
      properties:
        date: { type: string, description: YYYY-MM-DD }
        safeguarding_open: { type: integer }
        incidents_today: { type: integer }
        medication_due: { type: integer }
        meals_served: { type: integer }
        observations_week: { type: integer }
        by_type:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              count: { type: integer }

    # ─────────────────────────────────────────────────────────────────────────
    # Leave / holiday requests
    # ─────────────────────────────────────────────────────────────────────────
    LeaveRequest:
      type: object
      properties:
        id: { type: string }
        staff_id: { type: string }
        staff_name: { type: string }
        branch_slug: { type: string }
        type: { type: string, enum: [leave, unpaid_leave, maternity, dependant_sick, sick], description: Identical to the attendance leave statuses so approval maps 1:1 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: Inclusive }
        days: { type: integer, description: Working days (Mon-Fri) in range }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, declined, cancelled] }
        requested_by_id: { type: string }
        reviewed_by_id: { type: string }
        reviewed_by: { type: string }
        reviewed_at: { type: string, format: date-time, nullable: true }
        decline_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LeaveRequestInput:
      type: object
      required: [type, start_date, end_date]
      properties:
        staff_id: { type: string, description: Optional — managers file for a staff member; self-service resolves via Staff.UserID }
        type: { type: string, enum: [leave, unpaid_leave, maternity, dependant_sick, sick] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        reason: { type: string }

    LeaveBalance:
      type: object
      description: One leave type's balance for the UK leave year (Apr-Mar). Capped types draw against an allowance; uncapped types report usage only.
      properties:
        type: { type: string }
        capped: { type: boolean }
        year: { type: integer, description: The leave year's starting calendar year }
        allowance: { type: integer }
        taken: { type: integer }
        pending: { type: integer }
        remaining: { type: integer }

    # ─────────────────────────────────────────────────────────────────────────
    # Notifications
    # ─────────────────────────────────────────────────────────────────────────
    AppNotification:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string, description: Recipient }
        type: { type: string, example: leave_requested }
        title: { type: string }
        body: { type: string }
        link: { type: string, description: In-app href }
        entity_type: { type: string }
        entity_id: { type: string }
        read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    NotificationPreferences:
      type: object
      description: The emailable-type catalogue plus this user's muted (opted-out) types. In-app notifications always appear; muting only stops the email copy.
      properties:
        catalogue:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: leave_approved }
              label: { type: string, example: Your leave was approved }
        muted_types:
          type: array
          items: { type: string }

    # ─────────────────────────────────────────────────────────────────────────
    # My Profile (self-service)
    # ─────────────────────────────────────────────────────────────────────────
    MeProfileUpdate:
      type: object
      description: The safe self-editable subset of the staff record; employment fields stay manager-controlled.
      properties:
        phone: { type: string }
        email: { type: string, format: email }
        qualifications:
          type: array
          items: { type: string }
        emergency_contacts:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              relation: { type: string }
              phone: { type: string }
              email: { type: string }
        dbs_number: { type: string }
        dbs_expiry: { type: string, format: date }
        first_aid_expiry: { type: string, format: date }

    # ─────────────────────────────────────────────────────────────────────────
    # Room allocation (effective-dated assignments)
    # ─────────────────────────────────────────────────────────────────────────
    RoomAssignment:
      type: object
      properties:
        id: { type: string }
        branch_slug: { type: string }
        room_id: { type: string }
        room_name: { type: string, description: Computed projection }
        staff_id: { type: string, description: Staff assignments only }
        child_id: { type: string, description: Child assignments only }
        role_in_room: { type: string }
        is_primary: { type: boolean }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: string, enum: [active, scheduled, ended] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoomAssignmentInput:
      type: object
      required: [room_id]
      properties:
        staff_id: { type: string, description: Staff assignments (and body of child assignments uses child_id) }
        child_id: { type: string }
        room_id: { type: string }
        role_in_room: { type: string }
        is_primary: { type: boolean }
        start_date: { type: string, format: date }
        override_reason: { type: string, description: Required to override capacity/age/branch rules (audit-logged) }

    # ─────────────────────────────────────────────────────────────────────────
    # Configuration
    # ─────────────────────────────────────────────────────────────────────────
    TaxonomyTerm:
      type: object
      properties:
        id: { type: string }
        branch_slug: { type: string, description: '"" = org-wide default' }
        category: { type: string, enum: [session_type, allergy_type, dietary_label, age_group] }
        code: { type: string, description: Stable machine key stored on records }
        label: { type: string }
        start_time: { type: string, description: 'HH:MM (session_type only)' }
        end_time: { type: string, description: 'HH:MM (session_type only)' }
        min_age_months: { type: integer, description: 'age_group only; 0 = from birth (not omitted)' }
        max_age_months: { type: integer, description: 'age_group only; 0 = unbounded top band (not omitted)' }
        sort_order: { type: integer }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Term:
      type: object
      properties:
        id: { type: string }
        branch_slug: { type: string, description: '"" = org-wide' }
        name: { type: string, example: Autumn term }
        start_date: { type: string, format: date, description: Inclusive }
        end_date: { type: string, format: date, description: Inclusive }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BranchTemplate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        rooms:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              code: { type: string }
              age_range: { type: string }
              min_age_months: { type: integer }
              max_age_months: { type: integer }
              capacity: { type: integer }
              staff_ratio: { type: integer }
        age_groups:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EmailTemplate:
      type: object
      properties:
        id: { type: string }
        key: { type: string, example: enquiry_acknowledgement }
        subject: { type: string }
        body: { type: string, description: "Message text with {{placeholders}}; the service wraps it in the branded shell" }
        updated_at: { type: string, format: date-time }