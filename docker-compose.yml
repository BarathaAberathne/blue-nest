services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: blue-nest-mongo
    restart: unless-stopped
    # Dev convenience only, bound to LOOPBACK so MongoDB is never reachable from
    # the public internet (native `make dev` connects via localhost:27017). The
    # prod overlay (docker-compose.prod.yml) removes this mapping entirely.
    # NEVER use "27017:27017" here — that binds 0.0.0.0 (all interfaces).
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: blue_nest_montessori
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Go API ───────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blue-nest-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: blue_nest_montessori
      FRONTEND_URL: http://localhost:3000
      # In-network Next.js address + shared secret for on-demand cache
      # revalidation (branch changes bust the public route cache instantly).
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: dev-revalidate-secret
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time (used by the browser)
        NEXT_PUBLIC_API_URL: http://localhost:8080
        # Used by the Next.js image optimiser server-side inside Docker
        NEXT_PUBLIC_API_INTERNAL_URL: http://backend:8080
    container_name: blue-nest-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Runtime env for the rewrites() function (read at server startup, not baked)
      NEXT_PUBLIC_API_INTERNAL_URL: http://backend:8080
      # Shared secret for backend-triggered cache revalidation (/api/revalidate)
      REVALIDATE_SECRET: dev-revalidate-secret
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  uploads_data:
