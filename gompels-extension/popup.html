<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      body { width: 360px; margin: 0; padding: 12px; color: #1f2937; }
      h1 { font-size: 13px; margin: 0 0 2px; display: flex; align-items: center; gap: 6px; }
      h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #14b8a6; }
      .muted { color: #6b7280; font-size: 12px; }

      /* Summary + progress */
      .summary { margin: 8px 0 4px; }
      .bar { height: 6px; background: #f1f5f9; border-radius: 999px; overflow: hidden; }
      .bar > span { display: block; height: 100%; background: #14b8a6; width: 0; transition: width .25s; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: #475569; }
      .chip.ok { background: #dcfce7; color: #15803d; }
      .chip.sub { background: #fef3c7; color: #b45309; }
      .chip.bad { background: #fee2e2; color: #b91c1c; }

      /* Lines */
      .list { max-height: 280px; overflow: auto; margin-top: 8px; }
      .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
      .row .name { line-height: 1.3; }
      .code { font-family: ui-monospace, monospace; color: #334155; }
      .tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px; white-space: nowrap; background: #f1f5f9; color: #64748b; }
      .tag.ok { background: #dcfce7; color: #15803d; }
      .tag.sub { background: #fef3c7; color: #b45309; }
      .tag.bad { background: #fee2e2; color: #b91c1c; }

      button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 8px; background: #0f172a; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      .empty { padding: 16px 0; text-align: center; }
      .hint { margin-top: 8px; font-size: 11px; }
      label.opt { display: flex; align-items: center; gap: 6px; margin-top: 10px; cursor: pointer; font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span> Blue Nest → Gompels cart</h1>
    <div id="content">
      <div class="empty muted">No order queued. In the Blue Nest admin, open a generated Gompels purchase order and click “Add to Gompels cart”.</div>
    </div>
    <button id="fill" hidden>Fill cart now</button>
    <p id="hint" class="hint muted" hidden>Make sure you’re on the Gompels Quick Order page and logged in.</p>
    <label class="opt">
      <input type="checkbox" id="autostart" /> Auto-fill when the Gompels tab opens
    </label>
    <script src="popup.js"></script>
  </body>
</html>
