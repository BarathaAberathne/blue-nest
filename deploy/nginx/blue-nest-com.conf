# Blue Nest Montessori — blue-nest.com (LEGACY domain, fully retired)
#
# bluenest.uk is live and canonical (since 2026-08-13). Every legacy host now
# redirects — the Stripe webhook endpoint was re-pointed to
# https://api.bluenest.uk/api/v1/webhooks/stripe on 2026-08-13, so nothing
# external depends on api.blue-nest.com any more. The API host uses 308
# (method+body preserving) in case any lingering client POSTs and follows
# redirects.
#
# The deployed copy on the droplet includes the certbot-managed TLS lines;
# this repo copy documents the intended shape.

server {
    server_name blue-nest.com www.blue-nest.com;
    # certbot-managed: listen 443 ssl + certificate paths
    return 301 https://bluenest.uk$request_uri;
}

server {
    server_name api.blue-nest.com;
    # certbot-managed: listen 443 ssl + certificate paths
    return 308 https://api.bluenest.uk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name blue-nest.com www.blue-nest.com;
    return 301 https://bluenest.uk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.blue-nest.com;
    return 308 https://api.bluenest.uk$request_uri;
}
