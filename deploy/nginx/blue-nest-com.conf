# Blue Nest Montessori — nginx config for blue-nest.com
#
# Temporary stand-in domain while bluenest.uk is being purchased. Keeps the
# repo's SEO content (sitemap, metadata, JSON-LD) pointing at bluenest.uk —
# this file just provides a working public endpoint right now.
#
# Install on the droplet:
#   sudo cp deploy/nginx/blue-nest-com.conf /etc/nginx/sites-available/blue-nest-com
#   sudo ln -sf /etc/nginx/sites-available/blue-nest-com /etc/nginx/sites-enabled/blue-nest-com
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot:
#   sudo certbot --nginx -d blue-nest.com -d www.blue-nest.com -d api.blue-nest.com \
#     --agree-tos -m manager@bluenest.uk --no-eff-email --redirect

# Shared upgrade map (must be in http{} scope — keeping it here is fine
# because nginx merges duplicates from multiple includes).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Frontend ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name blue-nest.com www.blue-nest.com;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml text/xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

# ── API ─────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.blue-nest.com;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location /webhooks/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
