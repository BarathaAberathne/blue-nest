# Blue Nest Montessori — blue-nest.com (LEGACY domain)
#
# bluenest.uk is live and canonical (since 2026-08-13). This config now only:
#   1. 301-redirects the legacy site hosts to https://bluenest.uk
#   2. keeps api.blue-nest.com SERVING (not redirecting) so externally
#      registered callers — the Stripe webhook endpoint in particular — keep
#      working until they are re-pointed at api.bluenest.uk. A redirect would
#      silently break webhook POST delivery.
# Once the Stripe dashboard endpoint is moved to api.bluenest.uk, the API
# block below can be reduced to a redirect too.
#
# The deployed copy on the droplet includes the certbot-managed TLS lines;
# this repo copy documents the intended shape.

server {
    server_name blue-nest.com www.blue-nest.com;
    # certbot-managed: listen 443 ssl + certificate paths
    return 301 https://bluenest.uk$request_uri;
}

server {
    server_name api.blue-nest.com;
    # certbot-managed: listen 443 ssl + certificate paths

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location /webhooks/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name blue-nest.com www.blue-nest.com;
    return 301 https://bluenest.uk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.blue-nest.com;
    return 301 https://$host$request_uri;
}
