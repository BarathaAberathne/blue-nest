# Blue Nest Montessori — nginx server config
#
# Install on the droplet:
#   sudo cp deploy/nginx/bluenest.conf /etc/nginx/sites-available/bluenest
#   sudo ln -sf /etc/nginx/sites-available/bluenest /etc/nginx/sites-enabled/bluenest
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot once to add the TLS bits and the HTTP→HTTPS redirect:
#   sudo certbot --nginx -d bluenest.uk -d www.bluenest.uk -d api.bluenest.uk
#
# Certbot edits this file in-place to add `listen 443 ssl`, the cert paths and
# a redirect server block. After that the file diverges from the version in
# the repo — that is expected. Re-run certbot's edits whenever you bring this
# file forward from main.

# ─────────────────────────────────────────────────────────────────────────────
# Shared map: WebSocket Upgrade handling for the Next.js block
# ─────────────────────────────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────────────────────────────
# Frontend — Next.js on 127.0.0.1:3000
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name bluenest.uk;

    # Security headers — applied even on HTTP so they survive the certbot
    # rewrite. HSTS is enabled with a long max-age + preload-friendly flags.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # gzip text payloads (Next.js already brotli-encodes static assets but
    # SSR HTML benefits from compression at the edge).
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml text/xml;

    # Long-lived cache for Next's immutable build output.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header       Cache-Control     "public, max-age=31536000, immutable";
    }

    # Catch-all for app routes + RSC streaming.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Don't buffer streaming RSC responses.
        proxy_buffering off;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# API — Go backend on 127.0.0.1:8080
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.bluenest.uk;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Product image upload from the admin panel can be a few MB. Stripe
    # webhooks are tiny. 20M is a safe ceiling.
    client_max_body_size 20M;

    # Stripe webhook needs the raw request body for signature verification —
    # no buffering, no upload-tempfile shenanigans.
    location /webhooks/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# www → apex (canonical host is bluenest.uk)
# certbot-managed on the droplet: listen 443 ssl + certificate paths
# ─────────────────────────────────────────────────────────────────────────────
server {
    server_name www.bluenest.uk;
    return 301 https://bluenest.uk$request_uri;
}
